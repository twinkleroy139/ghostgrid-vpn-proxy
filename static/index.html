<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostGrid // Cyberpunk Web Proxy</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
</head>
<body>
  <header class="hud-bar">
    <div class="hud-title">⚡ GHOSTGRID // PROXY_V1</div>
    <div class="hud-status">
      <span class="status-dot"></span>
      <span id="userStatusLabel">SYSTEM: ONLINE</span>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <section class="cyber-card" style="max-width: 540px; width: 100%; padding: 2.5rem;">
      <h1 style="color: var(--neon-cyan); font-size: 1.8rem; margin-bottom: 0.5rem; letter-spacing: 2px;">
        ACCESS TERMINAL
      </h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; line-height: 1.5;">
        Secure, asynchronous, no-install web proxy isolation tunnel.
      </p>

      <div style="display: flex; flex-direction: column; gap: 1rem;">
        <button id="guestBtn" class="cyber-btn" style="width: 100%;">
          ENTER AS GUEST OPERATIVE [DEV]
        </button>
        <button id="loginBtn" class="cyber-btn cyber-btn-magenta" style="width: 100%;">
          SIGN IN WITH GOOGLE (FIREBASE)
        </button>
      </div>

      <div style="margin-top: 2rem; border-top: 1px dashed var(--border-neon); padding-top: 1rem; font-size: 0.75rem; color: var(--text-muted);">
        STATUS: UNRESTRICTED DEV NODE // RENDER LIVE COMPATIBLE
      </div>
    </section>
  </main>

  <script src="/static/js/firebase_client.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
