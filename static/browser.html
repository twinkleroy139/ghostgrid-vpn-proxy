<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostGrid // Terminal Workspace</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
</head>
<body>
  <header class="hud-bar">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="/" style="color: var(--neon-cyan); text-decoration: none; font-weight: 700;">[⚡ GHOSTGRID]</a>
      <span style="color: var(--text-muted); font-size: 0.85rem;" id="activeUrlDisplay">READY FOR TARGET</span>
    </div>

    <!-- UPLINK: dropdown + connect button + status dot + timer + egress IP -->
    <div style="display: flex; align-items: center; gap: 0.6rem;">
      <span id="vpnStatusDot" class="status-dot" style="background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan);"></span>
      <label for="vpnNodeSelect" style="color: var(--neon-cyan); font-size: 0.75rem; letter-spacing: 1px; font-weight: bold;">UPLINK:</label>
      <select id="vpnNodeSelect" class="cyber-input" style="padding: 0.25rem 0.6rem; font-size: 0.8rem; background: #070b12; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); cursor: pointer;">
        <option value="direct">⚡ DIRECT (LOCAL / CLOUD)</option>
        <option value="us">🇺🇸 US NODE (NEW YORK)</option>
        <option value="de">🇩🇪 DE NODE (FRANKFURT)</option>
        <option value="sg">🇸🇬 SG NODE (SINGAPORE)</option>
        <option value="uk">🇬🇧 UK NODE (LONDON)</option>
      </select>

      <button id="connectBtn" class="cyber-btn" style="padding: 0.3rem 0.75rem; font-size: 0.75rem; min-width: 92px;">
        CONNECT
      </button>

      <span id="vpnStatusText" style="color: var(--text-muted); font-size: 0.75rem; letter-spacing: 1px; font-family: monospace;">DIRECT</span>
      <span id="vpnEgressIp" style="color: var(--neon-cyan); font-size: 0.7rem; letter-spacing: 1px; font-family: monospace; opacity: 0.7;">—</span>
    </div>

    <div class="hud-status">
      <span class="status-dot"></span>
      <span id="userStatusLabel">OPERATIVE: DEV</span>
      <button id="logoutBtn" class="cyber-btn cyber-btn-magenta" style="padding: 0.3rem 0.75rem; font-size: 0.75rem; margin-left: 1rem;">EXIT</button>
    </div>
  </header>

  <div class="browser-viewport">
    <div class="address-bar-container">
      <input 
        type="text" 
        id="targetUrlInput" 
        class="cyber-input address-input" 
        placeholder="ENTER TARGET URL (e.g. youtube.com or wikipedia.org)" 
        value="https://www.youtube.com"
      />
      <button id="launchBtn" class="cyber-btn">TRANSMIT</button>
      <button id="reloadBtn" class="cyber-btn cyber-btn-magenta">RELOAD</button>
    </div>

    <!-- WAF escape banner — shown when the proxied page is blocked by bot detection -->
    <div id="wafBanner" style="display: none; padding: 0.75rem 1rem; margin: 0.5rem 1rem; background: rgba(255, 170, 0, 0.15); border: 1px solid var(--neon-amber, #ffaa00); border-radius: 4px; font-size: 0.85rem; color: var(--neon-amber, #ffaa00); display: none; align-items: center; justify-content: space-between; gap: 1rem;">
      <span id="wafBannerText">This site is protected by WAF bot detection and cannot be proxied.</span>
      <a id="wafEscapeLink" href="#" target="_blank" rel="noopener noreferrer" class="cyber-btn" style="padding: 0.3rem 0.75rem; font-size: 0.75rem; text-decoration: none; white-space: nowrap;">
        OPEN REAL SITE ↗
      </a>
    </div>

    <div id="frameLoader" style="display: none; padding: 0.5rem; color: var(--neon-cyan); font-size: 0.85rem;">
      &gt; RETRIEVING AND REWRITING UPSTREAM STREAM...
    </div>

    <iframe 
      id="proxyFrame" 
      class="proxy-frame" 
      src="about:blank"
      sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-downloads allow-presentation"
    ></iframe>
  </div>

  <script src="/static/js/firebase_client.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/browser.js"></script>
</body>
</html>
